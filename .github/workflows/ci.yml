# Vérifie à chaque push et chaque pull request que le projet compile,
# respecte le style (ktlint), passe Android Lint et les tests unitaires.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Met en cache les téléchargements Gradle entre deux exécutions.
      - uses: gradle/actions/setup-gradle@v5

      - name: Style, lint, tests et build
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
